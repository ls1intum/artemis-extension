name: Sync CHANGELOG

on:
    push:
        branches:
            - main
        paths:
            - "CHANGELOG.md"
    pull_request:
        branches:
            - main
        types:
            - closed
        paths:
            - "CHANGELOG.md"
    workflow_dispatch: # Allows manual trigger from GitHub Actions tab

jobs:
    sync-changelog:
        runs-on: ubuntu-latest
        permissions:
            contents: write

        steps:
            - name: Checkout repository
              uses: actions/checkout@v6
              with:
                  token: ${{ secrets.GITHUB_TOKEN }}
                  fetch-depth: 0

            - name: Validate CHANGELOG exists
              run: |
                  test -f CHANGELOG.md || (echo "CHANGELOG.md not found" && exit 1)

            - name: Check CHANGELOG format
              run: |
                  echo "CHANGELOG.md validation passed"
